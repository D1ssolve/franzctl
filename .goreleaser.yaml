version: 2

project_name: franzctl

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: franzctl
    main: ./cmd/franzctl
    binary: franzctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.date={{ .Date }}

archives:
  - id: default
    ids:
      - franzctl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

homebrew_casks:
  - name: franzctl
    ids:
      - default
    binaries:
      - franzctl
    repository:
      owner: D1ssolve
      name: homebrew-tap
    homepage: https://github.com/D1ssolve/franzctl
    description: Keyboard-first terminal workbench for Apache Kafka
